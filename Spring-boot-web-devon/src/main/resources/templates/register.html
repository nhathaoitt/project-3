<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/register/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/register/css/small-business.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/register/register.css}"/>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="register-container">
            <div class="register-card">
                <!-- Header -->
                <div class="register-header">
                    <h2><img th:src="@{/img/register-user.png}" alt="register icon" class="header-icon">Create Account</h2>
                    <p>Please enter your information</p>
                </div>

                <div class="register-body">
                    <!-- Access Denied -->
                    <div class="alert alert-danger"
                         th:if="${param.accessDenied}">
                        <i class="fas fa-ban me-2"></i>
                        You are not authorized
                    </div>

                    <!-- Session Timeout -->
                    <div class="alert alert-danger"
                         th:if="${param.sessionTimeout}">
                        <i class="fas fa-clock me-2"></i>
                        Session timeout
                    </div>

                    <!-- Form -->
                    <form id="registerForm"
                          th:object="${userRegister}">

                        <!-- Full Name -->
                        <div class="form-group">
                            <label class="form-label" for="fullName">
                                <i class="fas fa-user me-1"></i>Full Name
                            </label>
                            <input type="text" id="fullName" name="fullName"
                                   class="form-control"
                                   placeholder="Enter your full name"
                                   required
                                th:value="${userRegister.fullName}">
                            <span
                                    class="error-message"
                                    style="display: none; color: red"
                                    id="noFullName"
                            >Vui lòng nhập họ và tên đầy đủ</span
                            >
                        </div>

                        <!-- Username -->
                        <div class="form-group">
                            <label class="form-label" for="username">
                                <i class="fas fa-at me-1"></i>Username
                            </label>
                            <input type="text" id="username" name="username"
                                   class="form-control"
                                   placeholder="Choose a username"
                                   required
                                   th:value="${userRegister.userName}">
                            <span
                                    class="error-message"
                                    style="display: none; color: red"
                                    id="noUsername"
                            >Vui lòng nhập tên người dùng</span
                            >
                        </div>

                        <!-- Password -->
                        <div class="form-group">
                            <label class="form-label" for="password">
                                <i class="fas fa-lock me-1"></i>Password
                            </label>
                            <div class="password-field">
                                <input type="password" id="password"
                                       name="password" class="form-control"
                                       placeholder="Create a strong password"
                                       required>
                                <span
                                        class="error-message"
                                        style="display: none; color: red"
                                        id="noPassword"
                                >Vui lòng nhập mật khẩu</span
                                >
                                <button type="button" class="password-toggle"
                                        onclick="togglePassword('password')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="form-group">
                            <label class="form-label" for="confirmPassword">
                                <i class="fas fa-lock me-1"></i>Confirm Password
                            </label>
                            <div class="password-field">
                                <input type="password" id="confirmPassword"
                                       name="confirmPassword"
                                       class="form-control"
                                       placeholder="Re-enter your password"
                                       required>
                                <span
                                        class="error-message"
                                        style="display: none; color: red"
                                        id="noConfirmPassword"
                                >Vui lòng nhập lại mật khẩu</span
                                >
                                <button type="button" class="password-toggle"
                                        onclick="togglePassword('confirmPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Terms -->
                        <div class="terms-section">
                            <div class="form-check">
                                <input class="form-check-input"
                                       type="checkbox"
                                       id="isAgreeTerms"
                                       name="isAgreeTerms">
                                <label class="form-check-label" for="isAgreeTerms">
                                    I agree to all statements in
                                    <a href="#" class="terms-link">Terms of Service</a>
                                    and
                                    <a href="#" class="terms-link">Privacy Policy</a>
                                </label>
                            </div>
                        </div>

                        <!-- Submit -->
                        <button class="register-btn" type="button" id="btnRegister">
                            <i class="fas fa-user-plus me-2"></i>Register
                        </button>
                    </form>

                    <!-- Social Login -->
                    <div class="social-login">
                        <div class="social-title">Or register with</div>
                        <div class="social-buttons">
                            <a href="#" class="social-btn" title="Register with Facebook">
                                <i class="fab fa-facebook-f"></i>
                            </a>
                            <a th:href="@{/oauth2/authorization/google}" class="social-btn" title="Register with Google">
                                <i class="fab fa-google"></i>
                            </a>
                            <a th:href="@{/oauth2/authorization/github}" class="social-btn" title="Register with GitHub">
                                <i class="fab fa-github"></i>
                            </a>
                        </div>
                    </div>

                    <!-- Login Link -->
                    <div class="login-link">
                        Already have an account?
                        <a th:href="@{/login}">Login here</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{admin/common/common-scripts :: jquery}"></th:block>
<!--JavaScript for password toggle-->
<script>
    function resetErrorMessage() {
        document.getElementById("noFullName").style.display = "none";
        document.getElementById("noUsername").style.display = "none";
        document.getElementById("noPassword").style.display = "none";
        document.getElementById("noConfirmPassword").style.display = "none";
    }
    function validateData(data){
        resetErrorMessage();
        var isValid = true;
        if (!data["fullName"] || data["fullName"].trim() === "") {
            document.getElementById("noFullName").style.display = "block";
            isValid = false;
        }
        if (!data["username"] || data["username"].trim() === "") {
            document.getElementById("noUsername").style.display = "block";
            isValid = false;
        }
        if (!data["password"] || data["password"].trim() === "") {
            document.getElementById("noPassword").style.display = "block";
            isValid = false;
        }
        if (!data["confirmPassword"] || data["confirmPassword"].trim() === "") {
            document.getElementById("noConfirmPassword").style.display = "block";
            isValid = false;
        }
        return isValid;
    }

    $("#btnRegister").click(function (e){
       e.preventDefault()
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const isAgreeTerms = document.getElementById('isAgreeTerms').checked;
        const data = {};
        const dataForm = $("#registerForm").serializeArray();
        $.each(dataForm, function(i, it){
           data[it.name] = it.value;
        });
        if (!isAgreeTerms) {
            alert('Bạn phải đồng ý với điều khoản cộng đồng!');
            return false;
        }
        if(password !== confirmPassword) {
            alert('Mật khẩu không khớp!');
            return false;
        }
        if (!validateData(data)){
            alert("Vui lòng nhập đầy đủ thông tin đăng ký");
            return;
        }
        else{
            $.ajax({
                url: "/users/register", //api gui ve
                type: "POST", // phuong thuc
                data: JSON.stringify(data), //chuyen doi object thanh json gui xuong server
                contentType: "application/json", // dinh dang du lieu gui di la Json
                dataType: "json", // du lieu gui xuong server la JSON
                success: function (response){
                    alert(response.message);
                    window.location.href = "/login";
                },
                error: function (response){
                    alert(response.responseJSON.message)
                }
            });
        }
    });
</script>
</body>
</html>
